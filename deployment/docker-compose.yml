x-common: &common
  networks:
    - default
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  adminer:
    image: adminer:latest
    container_name: adminer
    hostname: adminer
    ports:
      - 8080:8080
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    depends_on:
      - postgres
    <<: *common

  postgres:
    image: postgres:17
    container_name: postgres
    hostname: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *common

  kafka:
    image: bitnamilegacy/kafka:3.6
    container_name: kafka
    hostname: kafka
    ports:
      - 9094:9094
      - 6666:6666
    volumes:
      - kafka_data:/bitnami/kafka
    environment:
      # KRaft settings
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      # Listeners
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # JMX (non-production)
      - JMX_PORT=6666
    <<: *common

  kafka-ui:
    depends_on:
      - kafka
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    hostname: kafka-io
    ports:
      - 8088:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_METRICS_PORT: 6666

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: keycloak
    hostname: keycloak
    volumes:
      - ./providers:/opt/keycloak/providers:ro
      - ./conf/events-config.json:/opt/keycloak/conf/events-config.json:ro
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: password
      
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: password
      
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      
      KC_LOG_LEVEL: INFO
      
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CLIENT_ID: keycloak
      KAFKA_USER_TOPIC: keycloak-user-events
      KAFKA_ADMIN_TOPIC: keycloak-admin-events
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT

      KAFKA_ACKS: all
      KAFKA_RETRIES: 3
      KAFKA_COMPRESSION: gzip
      
      KAFKA_ALLOWED_REALMS: ""
      KAFKA_CONFIG_FILE: events-config.json
    command:
      - start-dev
    ports:
      - 8084:8080
      - 8443:8443
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    <<: *common

volumes:
  kafka_data:
    driver: local

  postgres_data:
    driver: local

networks:
  default:
    driver: bridge
plugins {
    id 'java'
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'org.keycloak:keycloak-core:26.4.1'
    compileOnly 'org.keycloak:keycloak-server-spi:26.4.1'
    compileOnly 'org.keycloak:keycloak-server-spi-private:26.4.1'
    compileOnly 'org.keycloak:keycloak-services:26.4.1'
    compileOnly 'org.jboss.logging:jboss-logging:3.5.3.Final'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

test {
    useJUnitPlatform()
}